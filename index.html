<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NaijaMarkt — Buy & Sell in Nigeria</title>

  <meta
    name="description"
    content="NaijaMarkt is a Nigerian marketplace where people can buy and sell products across Nigeria."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f5;
      color: #222;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1200px, 94%);
      margin: 0 auto;
    }

    .primary {
      border: 0;
      background: #0b8f3c;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
    }

    .primary:hover {
      background: #087832;
    }

    .secondary {
      border: 1px solid #0b8f3c;
      background: white;
      color: #0b8f3c;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: 700;
    }

    .secondary:hover {
      background: #eef8f1;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header style="
    background:#0b8f3c;
    color:white;
    padding:14px 0;
    position:sticky;
    top:0;
    z-index:1000;
  ">
    <div class="container" style="
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      flex-wrap:wrap;
    ">

      <!-- LOGO -->
      <div>
        <div style="
          font-size:24px;
          font-weight:800;
          line-height:1;
        ">
          NaijaMarkt
        </div>

        <div style="
          font-size:12px;
          margin-top:4px;
          opacity:.9;
        ">
          Buy & Sell Across Nigeria
        </div>
      </div>

      <!-- HEADER ACTIONS -->
      <div style="
        display:flex;
        align-items:center;
        gap:8px;
        flex-wrap:wrap;
      ">

        <button
          type="button"
          class="secondary"
          id="loginButton"
        >
          Login
        </button>

        <button
          type="button"
          class="secondary"
          id="signupButton"
        >
          Sign Up
        </button>

        <button
          type="button"
          class="secondary"
          id="cartButton"
        >
          Cart
        </button>

        <button
          type="button"
          class="secondary"
          id="liveButton"
        >
          Live
        </button>

        <button
          type="button"
          class="primary"
          id="sellButton"
        >
          Sell an Item
        </button>

      </div>
    </div>
  </header>

</body>
</html>
