<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NaijaMarkt — Buy & Sell in Nigeria</title>

  <meta
    name="description"
    content="NaijaMarkt is a Nigerian marketplace where people can buy and sell products across Nigeria."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f5;
      color: #222;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1200px, 94%);
      margin: 0 auto;
    }

    .primary {
      border: 0;
      background: #0b8f3c;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
    }

    .primary:hover {
      background: #087832;
    }

    .secondary {
      border: 1px solid #0b8f3c;
      background: white;
      color: #0b8f3c;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: 700;
    }

    .secondary:hover {
      background: #eef8f1;
    }
  </style>
</head>

</html>
