<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaijaMarkt - Buy & Sell in Nigeria</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #008751;
      color: white;
      padding: 16px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .login {
      background: white;
      color: #008751;
      padding: 9px 15px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      background: white;
      padding: 35px 16px;
      text-align: center;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    .search {
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    .search input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 16px;
    }

    .search button {
      background: #008751;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 7px;
      font-size: 16px;
    }

    .location {
      max-width: 700px;
      margin: 12px auto 0;
      padding: 12px;
      background: #f1f8f4;
      border-radius: 7px;
      color: #008751;
    }

    .section {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .category {
      background: white;
      padding: 18px 10px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .product-image {
      height: 150px;
      background: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    .product-info {
      padding: 12px;
    }

    .price {
      color: #008751;
      font-weight: bold;
      font-size: 18px;
      margin: 7px 0;
    }

    .place {
      color: #777;
      font-size: 13px;
    }
